name: Server build

on:
  push:
    branches: [Server]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-vps-build
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/Server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B test
      - name: Validate compose
        run: docker compose config --quiet

  build-images-on-vps:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer source and build without starting containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          release="/opt/library-server/releases/${GITHUB_SHA}"
          ssh -p 2222 -o HostKeyAlias="$VPS_HOST" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$release'"
          git archive --format=tar "$GITHUB_SHA" | ssh -p 2222 -o HostKeyAlias="$VPS_HOST" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "tar -xf - -C '$release'"
          ssh -p 2222 -o HostKeyAlias="$VPS_HOST" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- "$release" <<'REMOTE'
          set -eu
          cd "$1"
          for pair in discovery:discovery-service identity:identity-service catalog:catalog-service circulation:circulation-service reservation:reservation-service notification:notification-service gateway:api-gateway; do
            name=${pair%%:*}
            module=${pair#*:}
            DOCKER_BUILDKIT=0 docker build --memory 600m --memory-swap 600m --build-arg "SERVICE=$module" -t "library-server/$name:latest" .
          done
          docker pull redis:7
          docker pull apache/kafka:3.9.1
          REMOTE
