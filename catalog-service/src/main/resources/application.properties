server.port=8082
spring.application.name=catalog-service

eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# SQLite Database
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/catalog.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

spring.jpa.open-in-view=false

# Cache: use Redis in environments that provide it; local cache keeps development/demo runnable.
app.cache.provider=${CACHE_PROVIDER:local}
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
app.seed.books=${SEED_BOOKS:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
