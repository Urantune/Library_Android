server.port=${SERVER_PORT:8082}
spring.application.name=catalog-service
spring.datasource.url=jdbc:sqlite:${DB_PATH:catalog-service/data/catalog.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# SQLite Database
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

spring.jpa.open-in-view=false

# Cache: use Redis in environments that provide it; local cache keeps development/demo runnable.
app.cache.provider=${CACHE_PROVIDER:local}
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
app.seed.books=${SEED_BOOKS:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.profiles.default=local
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
