server.port=${SERVER_PORT:8081}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.application.name=identity-service
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/identity.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false
app.auth.key-dir=${AUTH_KEY_DIR:./data/auth-keys}
app.auth.issuer=library-identity
app.auth.audience=library-api
app.auth.access-seconds=900
app.auth.refresh-seconds=604800
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.connection-timeout=10s
spring.profiles.default=local
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
