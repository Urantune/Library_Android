server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.application.name=identity-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/identity.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false
app.auth.key-dir=${AUTH_KEY_DIR:./data/auth-keys}
app.auth.issuer=library-identity
app.auth.audience=library-api
app.auth.access-seconds=900
app.auth.refresh-seconds=604800
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.connection-timeout=10s
