name: library-services

x-service: &service
  restart: unless-stopped
  environment: &service-env
    EUREKA_URL: http://discovery:8761/eureka/
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ENABLED: "true"
    REDIS_HOST: redis
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  networks: [library]

services:
  discovery:
    <<: *service
    image: library-server/discovery:latest
    build: {context: ., args: {SERVICE: discovery-service}}
    environment:
      SERVER_PORT: 8761
    ports: ['127.0.0.1:${DISCOVERY_PORT:-8761}:8761']
    healthcheck: &health
      test: [CMD-SHELL, 'curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s

  identity:
    <<: *service
    image: library-server/identity:latest
    build: {context: ., args: {SERVICE: identity-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_PATH: /data/identity.db
    volumes:
      - ${DATA_ROOT:-.}/identity-service/data:/data
      - auth-keys:/app/data/auth-keys
    depends_on:
      discovery: {condition: service_healthy}
    healthcheck: *health

  catalog:
    <<: *service
    image: library-server/catalog:latest
    build: {context: ., args: {SERVICE: catalog-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_PATH: /data/catalog.db
      CACHE_PROVIDER: redis
      CACHE_TTL_SECONDS: 60
    volumes:
      - ${DATA_ROOT:-.}/catalog-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
    healthcheck: *health

  circulation:
    <<: *service
    image: library-server/circulation:latest
    build: {context: ., args: {SERVICE: circulation-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_PATH: /data/circulation.db
      SERVICE_IDENTITY_URL: http://identity:8081
    volumes:
      - ${DATA_ROOT:-.}/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
    healthcheck: *health

  reservation:
    <<: *service
    image: library-server/reservation:latest
    build: {context: ., args: {SERVICE: reservation-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_PATH: /data/reservation.db
      APP_CLIENTS_CATALOG_BASE_URL: http://catalog:8082
      APP_CLIENTS_CIRCULATION_BASE_URL: http://circulation:8083
    volumes:
      - ${DATA_ROOT:-.}/reservation-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      catalog: {condition: service_healthy}
      circulation: {condition: service_healthy}
    healthcheck: *health

  notification:
    <<: *service
    image: library-server/notification:latest
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_PATH: /data/notification.db
    volumes:
      - ${DATA_ROOT:-.}/notification-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
    healthcheck: *health

  gateway:
    <<: *service
    image: library-server/gateway:latest
    build: {context: ., args: {SERVICE: api-gateway}}
    environment:
      <<: *service-env
      SERVER_PORT: 8080
    ports: ['${GATEWAY_PORT:-8080}:8080']
    volumes: ['auth-keys:/app/data/auth-keys:ro']
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      circulation: {condition: service_healthy}
      reservation: {condition: service_healthy}
      notification: {condition: service_healthy}
    healthcheck: *health

networks:
  library:
    external: true
    name: library-network
volumes:
  auth-keys:
