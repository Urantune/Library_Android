x-service: &service
  restart: unless-stopped
  environment: &service-env
    EUREKA_URL: http://discovery:8761/eureka/
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ENABLED: "true"
    REDIS_HOST: redis
  networks: [library]

services:
  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes: [redis-data:/data]
    networks: [library]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [library]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18

  discovery:
    <<: *service
    build: {context: ., args: {SERVICE: discovery-service}}
    environment:
      SERVER_PORT: 8761
    ports: ['127.0.0.1:${DISCOVERY_PORT:-8761}:8761']
    healthcheck: &health
      test: [CMD-SHELL, 'curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s

  identity:
    <<: *service
    build: {context: ., args: {SERVICE: identity-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_PATH: /data/identity.db
    volumes:
      - ${DATA_ROOT:-.}/identity-service/data:/data
      - auth-keys:/app/data/auth-keys
    depends_on:
      discovery: {condition: service_healthy}
    healthcheck: *health

  catalog:
    <<: *service
    build: {context: ., args: {SERVICE: catalog-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_PATH: /data/catalog.db
      CACHE_PROVIDER: redis
      CACHE_TTL_SECONDS: 60
    volumes:
      - ${DATA_ROOT:-.}/catalog-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: *health

  circulation:
    <<: *service
    build: {context: ., args: {SERVICE: circulation-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_PATH: /data/circulation.db
      SERVICE_IDENTITY_URL: http://identity:8081
    volumes:
      - ${DATA_ROOT:-.}/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck: *health

  reservation:
    <<: *service
    build: {context: ., args: {SERVICE: reservation-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_PATH: /data/reservation.db
      APP_CLIENTS_CATALOG_BASE_URL: http://catalog:8082
      APP_CLIENTS_CIRCULATION_BASE_URL: http://circulation:8083
    volumes:
      - ${DATA_ROOT:-.}/reservation-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      catalog: {condition: service_healthy}
      circulation: {condition: service_healthy}
    healthcheck: *health

  notification:
    <<: *service
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_PATH: /data/notification.db
    volumes:
      - ${DATA_ROOT:-.}/notification-service/data:/data
      - auth-keys:/app/data/auth-keys:ro
    depends_on:
      identity: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck: *health

  gateway:
    <<: *service
    build: {context: ., args: {SERVICE: api-gateway}}
    environment:
      <<: *service-env
      SERVER_PORT: 8080
    ports: ['${GATEWAY_PORT:-8080}:8080']
    volumes: ['auth-keys:/app/data/auth-keys:ro']
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      circulation: {condition: service_healthy}
      reservation: {condition: service_healthy}
      notification: {condition: service_healthy}
    healthcheck: *health

networks:
  library:
volumes:
  auth-keys:
  kafka-data:
  redis-data:
