server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=identity-api
spring.cloud.gateway.server.webflux.routes[0].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-api
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/books/**,/api/authors/**,/api/categories/**,/api/publishers/**

spring.cloud.gateway.server.webflux.routes[2].id=identity-prefixed
spring.cloud.gateway.server.webflux.routes[2].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/identity/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=catalog-prefixed
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=circulation-prefixed
spring.cloud.gateway.server.webflux.routes[4].uri=lb://CIRCULATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/circulation/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=reservation-prefixed
spring.cloud.gateway.server.webflux.routes[5].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/reservation/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=notification-prefixed
spring.cloud.gateway.server.webflux.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
