server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway
spring.profiles.default=local

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=identity-api
spring.cloud.gateway.server.webflux.routes[0].uri=${IDENTITY_SERVICE_URI:lb://IDENTITY-SERVICE}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-api
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOG_SERVICE_URI:lb://CATALOG-SERVICE}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/books/**,/api/authors/**,/api/categories/**,/api/publishers/**

spring.cloud.gateway.server.webflux.routes[2].id=identity-prefixed
spring.cloud.gateway.server.webflux.routes[2].uri=${IDENTITY_SERVICE_URI:lb://IDENTITY-SERVICE}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/identity/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=catalog-prefixed
spring.cloud.gateway.server.webflux.routes[3].uri=${CATALOG_SERVICE_URI:lb://CATALOG-SERVICE}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=circulation-prefixed
spring.cloud.gateway.server.webflux.routes[4].uri=${CIRCULATION_SERVICE_URI:lb://CIRCULATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/circulation/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=reservation-prefixed
spring.cloud.gateway.server.webflux.routes[5].uri=${RESERVATION_SERVICE_URI:lb://RESERVATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/reservation/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=notification-prefixed
spring.cloud.gateway.server.webflux.routes[6].uri=${NOTIFICATION_SERVICE_URI:lb://NOTIFICATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[7].id=identity-api-prefix
spring.cloud.gateway.server.webflux.routes[7].uri=${IDENTITY_SERVICE_URI:lb://IDENTITY-SERVICE}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/identity/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[8].id=catalog-api-prefix
spring.cloud.gateway.server.webflux.routes[8].uri=${CATALOG_SERVICE_URI:lb://CATALOG-SERVICE}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[9].id=circulation-api-prefix
spring.cloud.gateway.server.webflux.routes[9].uri=${CIRCULATION_SERVICE_URI:lb://CIRCULATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/circulation/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[10].id=reservation-api-prefix
spring.cloud.gateway.server.webflux.routes[10].uri=${RESERVATION_SERVICE_URI:lb://RESERVATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/reservation/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[11].id=notification-api-prefix
spring.cloud.gateway.server.webflux.routes[11].uri=${NOTIFICATION_SERVICE_URI:lb://NOTIFICATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/notification/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=StripPrefix=2

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
