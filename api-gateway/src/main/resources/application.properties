server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/identity/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=circulation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CIRCULATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/circulation/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=reservation-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/reservation/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
